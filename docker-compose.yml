services:
  rss-ai:
    build: .
    container_name: rss-ai
    restart: unless-stopped
    environment:
      RSS_FEED_URL: ${RSS_FEED_URL:-https://www.wired.com/feed/tag/ai/latest/rss}
    volumes:
      # Кеш переводов переживает пересоздание контейнера и не тратит квоту провайдера заново.
      - ./data:/app/data
    ports:
      - "127.0.0.1:${RSS_AI_PORT:-8140}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
